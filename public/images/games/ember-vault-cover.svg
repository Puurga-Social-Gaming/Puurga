<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Ember Vault cover art">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0612"/>
      <stop offset="45%" stop-color="#1a0f24"/>
      <stop offset="100%" stop-color="#2d1218"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="50%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#ff7a18" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ff3d00" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vault" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2a4f"/>
      <stop offset="100%" stop-color="#120810"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#sky)"/>
  <circle cx="400" cy="560" r="280" fill="url(#emberGlow)" filter="url(#softGlow)"/>
  <path d="M0 520 Q200 460 400 500 T800 520 L800 800 L0 800 Z" fill="#140a10" opacity="0.9"/>
  <path d="M120 640 L280 420 L400 520 L520 380 L680 640 Z" fill="url(#vault)" stroke="#ff6b2b" stroke-width="3" opacity="0.92"/>
  <rect x="310" y="300" width="180" height="220" rx="18" fill="#1f1428" stroke="#ff8a3d" stroke-width="4"/>
  <path d="M350 520 L400 260 L450 520 Z" fill="#ff5a1f" opacity="0.35"/>
  <circle cx="400" cy="390" r="42" fill="#ffb347" opacity="0.85"/>
  <circle cx="400" cy="390" r="22" fill="#fff2d6"/>
  <text x="400" y="120" text-anchor="middle" fill="#ffe8cc" font-family="system-ui, sans-serif" font-size="54" font-weight="800" letter-spacing="4">EMBER VAULT</text>
  <text x="400" y="168" text-anchor="middle" fill="#ff9f5a" font-family="system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="8">PUURGA ARENA</text>
  <rect x="580" y="48" width="168" height="52" rx="26" fill="#ff4d00"/>
  <text x="664" y="82" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">NEW</text>
</svg>
